<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />

  <title>ToneCoach</title>
  <style>
    :root { --bg:#0b1220; --card:#0f172a; --muted:#9ca3af; --ring:#004bee; --border:#1f2937; }
    body { margin:0; background:var(--bg); 
          color:#e5e7eb; font-family:ui-sans-serif,system-ui,
          -apple-system,Segoe UI,Roboto,Arial; 
        }
    .wrap { 
       max-width:900px;
       margin:0 auto; 
       text-align: center;
       padding:24px
      
      }
    .tabs { display:flex; 
            justify-content: center;
           gap: 10px; 
           margin: 10px 0 16px;
           transition: background-color 1s;
     }
    .tab { padding:8px 12px; 
           border:1px solid var(--border); 
           border-radius:10px; background:
           var(--card); cursor:pointer;
          box-shadow: 0 0 15px rgba(37, 99, 235, 0.6), 0 0 30px rgba(37, 99, 235, 0.3);
        }
    .tab.active { 
      outline:2px solid var(--ring); 
    }
    .card { 
      background:var(--card); 
      border:1px solid var(--border); 
      border-radius:14px; padding:16px; 
      box-shadow: 0 0 15px rgba(37, 99, 235, 0.6), 0 0 30px rgba(37, 99, 235, 0.3);}
    .muted { 
      color:var(--muted); 
      font: size 15px;
    }
    .row { display:flex; 
           gap:14px; flex-wrap:wrap; 
           align-items:center; }
    textarea { width:100%;
              height:110px; 
              background:var(--bg); 
              color:#e5e7eb; border:1px solid var(--border); 
              border-radius:10px; 
              padding:10px;
             }
    button { background:var(--ring); color:#fff; border:none; border-radius:10px; padding:10px 14px; cursor:pointer; }
    .tone { display:inline-block;
            padding:4px 10px; 
            border-radius:999px; 
            font-weight:600; 
            text-transform:capitalize; 
          }
    .tone-neutral{ background:#334155; } .tone-frustrated{ background:#7f1d1d; } .tone-anxious{ background:#78350f; }
    .tone-calm{ background:#065f46; } .tone-upbeat{ background:#14532d; } .tone-confident{ background:#083344; }
    .tone-defensive{ 
      background:#7c2d12; 
    } 
    .tone-uncertain{ 
      background:#3f3f46; 
    }
    .mic { width:56px; 
          height:56px; 
          border-radius:999px; 
          display:inline-grid; 
          place-items:center;
          border:2px solid var(--border); 
          background:#1b2639; 
          font-size:22px; 
        }
    .mic.on { outline:3px solid rgba(37,99,235,.5);
              background:#0b3aa6;
              box-shadow: 0 0 15px rgba(37, 99, 235, 0.6), 0 0 30px rgba(37, 99, 235, 0.3);
            animation: pulse 1.5s infinite; 
          }
    .emoji { 
      font-size:42px; 
      line-height:1; }
    .grid {
       display:grid; 
       gap:14px; 
       grid-template-columns:1fr 1fr;
       }
    @media (max-width:840px){ .grid { grid-template-columns:1fr; } }
    ul { 
      margin:6px 0 0 20px; 
      padding:0; }
    pre { white-space:pre-wrap; }
    .mic:hover{
    background-color: #0d1d85;
    transition: background-color 1s;
  }
    .tab:hover{
    background-color: #0d1d85;
    transition: background-color 1s;

    }
  </style>
</head>
<body>
  <div class="wrap">
    <h1 style ="margin: 0px;">⚡ToneCoach</h1>
   
    <div class="muted">
      Emotion-aware live coaching</div>

    <div class="tabs">
      <div class="tab active" data-screen="live">Live</div>
      <div class="tab" data-screen="summary">Summary</div>
    </div>

    <!-- LIVE -->
    <section id="screen-live" class="card">
      <div class="row">
        <button id="micBtn" class="mic" title="Toggle mic">🎤</button>
        
        <div>
          <div class="muted">Status</div>
          <div id="status">idle</div>
        </div>
      </div>

      <div class="grid" style="margin-top:14px">
        <div class="card" style="display:flex; gap:12px; align-items:center;">
          <div id="emoji" class="emoji">😐</div>
          <div>
            <div class="muted">Emotion</div>
            <div id="toneBadge" class="tone tone-neutral">neutral</div>
          </div>
        </div>

        <div class="card">
          <div class="muted">Advice</div>
          <ul id="bullets"></ul>
          <div id="why" class="muted" style="margin-top:6px"></div>
        </div>
      </div>

      <div style="margin-top:12px" class="muted">Manual test (no mic)</div>
      <div class="row">
        <textarea id="utterance" placeholder="I've been waiting 20 minutes and might leave."></textarea>
        <button id="analyzeBtn" style="margin: top 0;">Analyze</button>
      </div>
    </section>

    <!-- SUMMARY -->
    <section id="screen-summary" class="card" style="display:none">
      <h3 style="margin-top:0">Summary</h3>
      <p class="muted">Paste utterances JSON and click Summarize.</p>
      <textarea id="summaryJson">[
  {"speaker":"customer","text":"I've been waiting 20 minutes and might leave."},
  {"speaker":"owner","text":"I’m sorry—let me check and give you a precise ETA."},
  {"speaker":"customer","text":"Okay, but I need to know how long."}
]</textarea>
      <div style="height:8px"></div>
      <button id="summaryBtn">Summarize</button>
      <div style="height:10px"></div>
      <pre id="summaryOut"></pre>
    </section>
  </div>

  <!-- Load Vapi Web as ESM, expose like the UMD our main.js expects -->
  <script type="module">
    import VapiWeb from 'https://cdn.jsdelivr.net/npm/@vapi-ai/web/+esm';
    window.VapiWeb = { default: VapiWeb };
  </script>

  <!-- Your app (must be after the block above) -->
  <script src="./main.js"></script>
</body>
</html>
